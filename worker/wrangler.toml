name = "asset-register-extractor"
main = "src/index.js"
compatibility_date = "2026-11-17"

[[d1_databases]]
binding = "DB"
database_name = "mechasset-db"
database_id = "c06404ff-9984-4d04-8108-895f5ac7b64a"

[vars]
GEMINI_MODEL = "gemini-3.5-flash-lite"

# Keep GEMINI_API_KEY as a Cloudflare Worker secret:
# npx wrangler secret put GEMINI_API_KEY

# R2 is intentionally not configured yet.
# Uploaded documents will not be persisted in R2 until the user enables it.
