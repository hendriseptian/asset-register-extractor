# MECHASSET - GitHub Pages Deployment
name: Deploy MECHASSET

on:
  push:
    branches: ["main"]

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare frontend files
        run: |
          mkdir -p _site
          cp index.html _site/
          cp dashboard.html _site/
          cp psv-dashboard.html _site/
          cp bvv-dashboard.html _site/
          cp extraction.html _site/
          cp multi-document.html _site/
          cp mapping.html _site/
          cp review.html _site/
          cp bvv-extraction.html _site/
          cp bvv-review.html _site/
          cp bvv-mapping.html _site/
          cp -r assets _site/
          touch _site/.nojekyll

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
