name: MECHASSET - Automatic Cloudflare Setup

on:
  workflow_dispatch:
    inputs:
      database_name:
        description: "D1 database name (existing database is reused)"
        required: true
        default: "mechasset-db"
      worker_name:
        description: "Cloudflare Worker name (must be unique in your account)"
        required: true
        default: "mechasset"

permissions:
  contents: read

concurrency:
  group: mechasset-cloudflare-setup
  cancel-in-progress: false

jobs:
  provision-and-deploy:
    name: Create D1, apply migrations, and deploy Worker
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout your Fork
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate installer script
        run: node --check scripts/provision-cloudflare.mjs

      - name: Validate required secrets
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          missing=()
          [[ -n "$CLOUDFLARE_API_TOKEN" ]] || missing+=("CLOUDFLARE_API_TOKEN")
          [[ -n "$CLOUDFLARE_ACCOUNT_ID" ]] || missing+=("CLOUDFLARE_ACCOUNT_ID")
          [[ -n "$GEMINI_API_KEY" ]] || missing+=("GEMINI_API_KEY")
          if (( ${#missing[@]} )); then
            printf 'Missing required repository secrets: %s\\n' "${missing[*]}"
            echo "Open Settings > Secrets and variables > Actions and create each secret. Secret values are never printed."
            exit 1
          fi
          echo "All required secrets are present."

      - name: Provision Cloudflare resources and deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          MECHASSET_D1_NAME: ${{ inputs.database_name }}
          MECHASSET_WORKER_NAME: ${{ inputs.worker_name }}
        run: node scripts/provision-cloudflare.mjs
