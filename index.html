<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MECHASSET | Mechanical Asset Management</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="icon" type="image/png" href="assets/mechasset-logo.svg">
  <script src="assets/js/theme.js" defer></script>
</head>
<body class="login-page">
  <main class="login-card">
    <img class="brand-logo" src="assets/mechasset-logo.svg" alt="MECHASSET logo">
    <p class="eyebrow">DTP · MECHASSET</p>
    <h1>Mechanical Asset Management</h1>
    <p class="muted">Prepare, consolidate and validate PSV and pressure equipment asset records from engineering documents.</p>
    <label for="worker-url">Workspace Connection URL</label>
    <input id="worker-url" type="url" placeholder="https://your-worker.your-subdomain.workers.dev">
    <button id="save-worker" class="btn primary">Continue to workspace</button>
    <p class="hint">Your workspace connection is saved in this browser only. Never enter an API key here.</p>
  </main>
  <script src="assets/js/app.js"></script>
</body></html>
